name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_evals:
        description: "Run the paid eval suite against the real model"
        type: boolean
        default: false

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env: { GEMINI_API_KEY: test }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install
      - run: npm run build

  # Evals cost money, so they run only when you ask for them (or add a label rule later).
  evals:
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals
    needs: unit
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults: { run: { working-directory: backend } }
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python -m evals.run_evals --min-pass-rate 0.85
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: backend/evals/reports/ }
